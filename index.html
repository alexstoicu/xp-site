<!DOCTYPE html>
<!-- Tells the browser this is modern HTML5 -->
<html lang="en">

<head>
  <!-- Character encoding: lets symbols like © and ★ display correctly -->
  <meta charset="UTF-8">
  <!-- Makes the page scale properly on phones -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Text shown in the browser tab and in search results -->
  <title>Night Lab XP</title>
  <meta name="description" content="A Stoic Science cyberpunk webspace. AI experiments, games, apps, and a blog after getting zapped.">
  <!-- Links the stylesheet (we create style.css in step 3) -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- HEADER: site name, tagline, and main navigation -->
  <header>
    <h1>Night Lab XP</h1>
    <p>a Stoic Science cyberpunk webspace. AI experiments, games, apps, and a blog after getting zapped.</p>

    <!-- nav = a group of site links. These pages get built in step 4 -->
    <nav>
      <a href="index.html">home</a> |
      <a href="journal.html">journal</a> |
      <a href="projects.html">projects</a> |
      <a href="downloads.html">downloads</a>
    </nav>
  </header>

  <!-- MAIN: the page's core content. Holds the two columns -->
  <main>

    <!-- ASIDE: side content. This becomes the profile-style sidebar in step 2 -->
    <aside>
      <p>[ sidebar goes here ]</p>
    </aside>

    <!-- SECTION: a themed block of content. This becomes the journal column -->
    <section>
      <h2>journal</h2>
      <p>[ journal entries go here ]</p>
    </section>

  </main>

  <!-- FOOTER: small print at the bottom of the page -->
  <footer>
    <p>&copy; 2026 Night Lab XP &middot; best viewed at 800x600 after midnight</p>
  </footer>

</body>
</html>
